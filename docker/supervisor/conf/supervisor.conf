[unix_http_server]
file=/tmp/supervisor.sock

; One program, not three: the SConcur master is itself the supervisor of the http,
; rabbitmq and tasks pools, and it holds one lock, one journal and one telemetry panel
; for all of them. Splitting them here would take that away.
[program:scl-sconcur-master]
command=php /app/demo/artisan sconcur:servers:master:start
stdout_logfile=/var/log/supervisor/scl-sconcur-master-out.log
stderr_logfile=/var/log/supervisor/scl-sconcur-master-err.log
autostart=true
autorestart=true
startsecs=0
stopsignal=TERM
; The master forwards SIGTERM to its groups and waits out their shutdownTimeoutMs —
; up to 30 s for the task pool. Supervisor's own default here is 10 s, which would kill
; the master mid-drain and make every graceful stop below it pointless.
stopwaitsecs=40
